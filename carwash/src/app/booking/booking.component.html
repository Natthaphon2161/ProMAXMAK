<div class="container">
  <h2>Booking Form</h2>
  <form #bookingForm="ngForm" (ngSubmit)="onSubmit(bookingForm)" novalidate>
    <div class="form-group">
      <label for="firstname">First Name:</label>
      <input type="text" id="firstname" [(ngModel)]="firstname" name="firstname" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="lastname">Last Name:</label>
      <input type="text" id="lastname" [(ngModel)]="lastname" name="lastname" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="phonenumber">Phone Number:</label>
      <input type="text" id="phonenumber" [(ngModel)]="phonenumber" name="phonenumber" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="size">Select Size:</label>
      <select id="size" [(ngModel)]="size" name="size" (change)="onSizeChange()" class="form-control" required>
        <option value="" disabled selected>Select Size</option>
        <option *ngFor="let size of sizes" [value]="size">{{ size }}</option>
      </select>
    </div>
    <div class="form-group">
      <label>Service Type:</label>
      <div *ngFor="let service of filteredServices">
        <label>
          <input type="checkbox" [value]="service.name" (change)="onServiceTypeChange(service.name, service.price, $event)">
          {{ service.name }} - ${{ service.price }}
        </label>
      </div>
    </div>
    <div *ngIf="selectedServices.length >= maxSelectedServices" class="text-warning">
      <small>You can only select up to {{ maxSelectedServices }} services.</small>
    </div>
    <div class="form-group">
      <label for="datetime">Date & Time:</label>
      <input type="datetime-local" id="datetime" [(ngModel)]="datetime" name="datetime" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="licenseplate">License Plate:</label>
      <input type="text" id="licenseplate" [(ngModel)]="licenseplate" name="licenseplate" class="form-control" required />
    </div>
    <div>
      <h4>Total Price: ${{ totalPrice }}</h4>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="bookingForm.invalid || selectedServices.length === 0">Book Now</button>
  </form>
</div>
