<div class="container">
    <h1>User Profile</h1>
    <div *ngIf="userProfile; else loading">
      <form *ngIf="isEditing; else viewMode" (ngSubmit)="updateProfile()" #profileForm="ngForm">
        <div class="form-group">
          <label>Firstname:</label>
          <input type="text" class="form-control" [(ngModel)]="userProfile.firstname" name="firstname" required>
        </div>
        <div class="form-group">
          <label>Lastname:</label>
          <input type="text" class="form-control" [(ngModel)]="userProfile.lastname" name="lastname" required>
        </div>
        <div class="form-group">
          <label>Phone Number:</label>
          <input type="text" class="form-control" [(ngModel)]="userProfile.phonenumber" name="phonenumber" required>
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" class="form-control" [(ngModel)]="userProfile.email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">Update</button>
        <button type="button" class="btn btn-secondary" (click)="toggleEdit()">Cancel</button>
      </form>
      <ng-template #viewMode>
        <p><strong>Firstname:</strong> {{ userProfile.firstname }}</p>
        <p><strong>Lastname:</strong> {{ userProfile.lastname }}</p>
        <p><strong>Phone Number:</strong> {{ userProfile.phonenumber }}</p>
        <p><strong>Email:</strong> {{ userProfile.email }}</p>
        <button class="btn btn-secondary" (click)="toggleEdit()">Edit Profile</button>
      </ng-template>
    </div>
    <ng-template #loading>
      <p>Loading profile...</p>
    </ng-template>
</div>
