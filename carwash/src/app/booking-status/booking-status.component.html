<div *ngIf="bookings.length > 0; else noBookings" class="container">
  <h2>Your Bookings</h2>

  <!-- ตัวเลือกจำนวนรายการต่อหน้า -->
  <div class="d-flex justify-content-end align-items-center mb-2">
    <label class="me-2 small text-secondary">Rows per page:</label>
    <select class="form-select form-select-sm w-auto"
            [(ngModel)]="itemsPerPage">
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="20">20</option>
    </select>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>Booking ID</th>
        <th>Service Type</th>
        <th>Date & Time</th>
        <th>License Plate</th>
        <th>Status</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <!-- ✅ ใช้ paginate ที่นี่ -->
      <tr *ngFor="let booking of bookings 
                  | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage }">
        <td>{{ booking.bookingId }}</td>
        <td>{{ booking.servicetype }}</td>
        <td>{{ formatDateTime(booking.datetime) }}</td>
        <td>{{ booking.licenseplate }}</td>
        <td>
          <div class="status-container" 
               [ngClass]="{
                 'pending': booking.status === 'pending',
                 'in-progress': booking.status === 'in-progress',
                 'complete': booking.status === 'complete',
                 'rejected': booking.status === 'rejected'
               }">
            {{ booking.status }}
          </div>
        </td>
        <td>{{ booking.totalPrice | currency:'THB' }}</td>
      </tr>
    </tbody>
  </table>

  <!-- ✅ ตัวควบคุม pagination -->
  <div class="d-flex justify-content-center mt-3">
    <pagination-controls 
      (pageChange)="currentPage = $event"
      previousLabel="Prev"
      nextLabel="Next">
    </pagination-controls>
  </div>
</div>

<ng-template #noBookings>
  <p class="no-bookings text-center mt-4 text-muted">No bookings found.</p>
</ng-template>
