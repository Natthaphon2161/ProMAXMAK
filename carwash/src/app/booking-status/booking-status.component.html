<div *ngIf="bookings.length > 0; else noBookings" class="container">
  <h2>Your Bookings</h2>

  <div class="d-flex justify-content-end align-items-center mb-2">
    <label class="me-2 small text-secondary">Rows per page:</label>
    <select class="form-select form-select-sm w-auto" [(ngModel)]="itemsPerPage">
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="20">20</option>
    </select>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th (click)="sortTable('bookingId')">
          Booking ID <i [ngClass]="getSortIcon('bookingId')"></i>
        </th>
        <th (click)="sortTable('servicetype')">
          Service Type <i [ngClass]="getSortIcon('servicetype')"></i>
        </th>
        <th (click)="sortTable('licenseplate')">
          License Plate <i [ngClass]="getSortIcon('licenseplate')"></i>
        </th>
        <th (click)="sortTable('datetime')">
          Date & Time <i [ngClass]="getSortIcon('datetime')"></i>
        </th>
        <th (click)="sortTable('status')">
          Status <i [ngClass]="getSortIcon('status')"></i>
        </th>
        <th (click)="sortTable('totalPrice')">
          Price <i [ngClass]="getSortIcon('totalPrice')"></i>
        </th>
      </tr>
    </thead>

    <tbody>
      <!-- ✅ ใช้ filteredBookings (ตัวที่ sort/paginate จริง) -->
      <tr *ngFor="let booking of filteredBookings
                  | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage }">
        <td>{{ booking.bookingId }}</td>
        <td>{{ booking.servicetype }}</td>
        <td>{{ booking.licenseplate }}</td>
        <td>{{ formatDateTime(booking.datetime) }}</td>
        <td>
          <div class="status-container"
               [ngClass]="{
                 'pending': booking.status === 'pending',
                 'in-progress': booking.status === 'in-progress',
                 'complete': booking.status === 'complete',
                 'rejected': booking.status === 'rejected'
               }">
            {{ booking.status }}
          </div>
        </td>
        <td>{{ booking.totalPrice | currency:'THB' }}</td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-center mt-3">
    <pagination-controls (pageChange)="currentPage = $event"
                         previousLabel="Prev"
                         nextLabel="Next">
    </pagination-controls>
  </div>
</div>

<ng-template #noBookings>
  <p class="no-bookings text-center mt-4 text-muted">No bookings found.</p>
</ng-template>
