
<div class="container py-3">
  <h4 class="mb-3">Select Date & Time</h4>

  <div class="row g-3">
    <!-- Calendar -->
    <div class="col-lg-7">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <button class="btn btn-sm btn-outline-secondary" (click)="prevMonth()">
              &lt;
            </button>
            <div class="fw-semibold">{{ monthLabel }}</div>
            <button class="btn btn-sm btn-outline-secondary" (click)="nextMonth()">
              &gt;
            </button>
          </div>

          <div class="calendar">
            <div class="calendar-header text-muted">
              <div *ngFor="let d of weekDays">{{ d }}</div>
            </div>

            <div class="calendar-grid">
              <button
                *ngFor="let d of days"
                class="day btn"
                [class.btn-outline-secondary]="!d.selected"
                [class.btn-primary]="d.selected"
                [class.outside]="!d.inMonth"
                [class.today]="d.isToday"
                [disabled]="d.isDisabled"
                (click)="selectDate(d)"
                >
                {{ d.date.getDate() }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Slots -->
    <div class="col-lg-5">
      <div class="card">
        <div class="card-header bg-light fw-semibold">Available Time Slots</div>
        <div class="card-body">
          <ng-container *ngIf="selectedDate; else pleaseSelect">
            <div class="mb-2">
              <span class="badge bg-secondary">
                {{ selectedDate | date:'EEE, d MMM y' }}
              </span>
            </div>

            <div *ngIf="isLoadingSlots" class="alert alert-info py-2">
              Loading available slots…
            </div>

            <div *ngIf="!isLoadingSlots && slots.length === 0" class="alert alert-warning py-2">
              No available slots for this day.
            </div>

            <div class="d-flex flex-wrap gap-2" *ngIf="!isLoadingSlots && slots.length > 0">
              <button
                *ngFor="let s of slots"
                class="btn btn-outline-primary btn-sm"
                [class.active]="s === selectedSlot"
                (click)="selectSlot(s)">
                <i class="bi bi-calendar-check me-1"></i>{{ s }}
              </button>
            </div>

            <div class="mt-3 d-flex gap-2" *ngIf="selectedSlot">
              <button class="btn btn-success btn-sm" (click)="confirmSelection()">
                Confirm: {{ selectedDate | date:'yyyy-MM-dd' }} {{ selectedSlot }}
              </button>
              <button class="btn btn-outline-secondary btn-sm" (click)="clearSelection()">
                Clear
              </button>
            </div>
          </ng-container>

          <ng-template #pleaseSelect>
            <div class="alert alert-info">
              <i class="bi bi-info-circle me-1"></i>
              Please select a date to view available time slots.
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
